name: Production dependency security gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Zero high/critical production vulnerabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.project }}
        env:
          HUSKY: "0"
      - name: npm audit (HIGH/CRITICAL, com exceções documentadas)
        run: node ../.github/scripts/audit-gate.mjs ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
