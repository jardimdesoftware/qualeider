name: Frontend Tests

# Roda lint e testes do frontend em todo PR para a main. O "Frontend CI/CD"
# só roda quando o PR é fechado (para gerar a imagem), então este é o
# workflow que barra um PR com teste quebrado ou cobertura abaixo de 70%.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint e testes do frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes com cobertura (mínimo de 70%)
        run: npm run test:cov -- --ci

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k, n) => `| ${n} | ${t[k].pct}% |`;
              console.log(["### Cobertura do frontend", "", "| Métrica | % |", "|---|---|",
                row("statements", "Statements"), row("branches", "Branches"),
                row("functions", "Functions"), row("lines", "Lines")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
