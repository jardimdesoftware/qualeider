# =============================================================================
# Frontend CI/CD — QuaLact
# =============================================================================
# Arquitetura de jobs:
# ┌──────────────┐
# │ tag-creation │
# └──────┬───────┘
#        │
# ┌──────▼──────────────────────┐
# │  frontend-docker            │  ← buildx multi-arch AMD64 + ARM64 → GHCR
# │  (lint + build + trivy)     │    Trivy bloqueia CRITICAL/HIGH em main
# └──────┬──────────────────────┘
#        │
# ┌──────▼──────────┐
# │release-creation  │
# └─────────────────┘
# =============================================================================

name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  workflow_dispatch:
    inputs:
      change_type:
        description: "Tipo de mudança (novo-marco, nova-feature-refactor, bug-fix, outros)"
        required: true
        default: "bug-fix"
        type: choice
        options:
          - novo-marco
          - nova-feature-refactor
          - bug-fix
          - outros

# ---------------------------------------------------------------------------
# Permissões globais mínimas
# ---------------------------------------------------------------------------
permissions:
  contents: read

# Cancelar execuções anteriores na mesma branch/PR
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/qualeider-frontend

jobs:
  # --------------------------------------------------------------------
  # 0) TAG CREATION
  # --------------------------------------------------------------------
  tag-creation:
    name: 0. Automatic Creation Process of New Tags
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      created_tag: ${{ steps.created_tag.outputs.created_tag }}
      change_type: ${{ steps.change_type.outputs.change_type }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Write PR body and log context
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "PR merged: ${{ github.event.pull_request.merged }}"
          echo "PR title: $PR_TITLE"
          echo "PR author: $PR_AUTHOR"
          printf '%s' "$PR_BODY" > body.txt
          echo "--- PR body ---"
          cat body.txt
          echo "--- end ---"

      - name: Extract type of change from PR
        id: change_type
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "change_type=${{ inputs.change_type }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          change_type=""
          if grep -qiE "\[x\]\s*\`?novo-marco\`?" body.txt; then
            change_type="novo-marco"
          elif grep -qiE "\[x\]\s*\`?nova-feature-refactor\`?" body.txt; then
            change_type="nova-feature-refactor"
          elif grep -qiE "\[x\]\s*\`?bug-fix\`?" body.txt; then
            change_type="bug-fix"
          elif grep -qiE "\[x\]\s*\`?outros\`?" body.txt; then
            change_type="outros"
          elif [[ "$PR_AUTHOR" == "dependabot[bot]" || "$PR_TITLE" =~ ^chore\(deps.*\): || "$PR_TITLE" =~ ^Bump[[:space:]] ]]; then
            echo "PR automatico de dependencias sem template detectado. Usando change_type=bug-fix."
            change_type="bug-fix"
          else
            echo "Nenhuma opção marcada corretamente no corpo do PR. Conteúdo:"
            cat body.txt
            exit 1
          fi

          echo "Tipo detectado: $change_type"
          echo "change_type=$change_type" >> "$GITHUB_OUTPUT"

      - name: Calculate new tag
        id: created_tag
        # Mesma regra no backend e no frontend (.github/scripts/next-version.sh):
        # os dois chegam na mesma versão para o mesmo merge.
        env:
          CHANGE_TYPE: ${{ steps.change_type.outputs.change_type }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          created_tag="$(bash .github/scripts/next-version.sh "$CHANGE_TYPE" "$MERGE_SHA")"
          echo "Nova tag: ${created_tag:-nenhuma (dev-<sha>)}"
          echo "created_tag=$created_tag" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------
  # 2) FRONTEND BUILD MULTI-ARCH & PUBLISH → GHCR
  # --------------------------------------------------------------------
  frontend-docker:
    name: 2. Frontend CI/CD
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: tag-creation
    if: >
      (github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      # Se for um push/dispatch em `main` ou PR alvo `main`, Trivy deve falhar em CRITICAL/HIGH
      TRIVY_BLOCKING_EXIT_CODE: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || startsWith(github.ref, 'refs/heads/main')) && '1' || '0' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests (cobertura mínima de 70%)
        run: npm run test:cov -- --ci

      # --- Trivy FS Scan (bloqueia CRITICAL/HIGH em main e PRs para main) ---
      - name: Trivy — Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "frontend"
          format: "table"
          exit-code: ${{ env.TRIVY_BLOCKING_EXIT_CODE }}
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: "frontend/.trivyignore"

      # --- Trivy SARIF para GitHub Security tab ---
      - name: Trivy — SARIF Report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "frontend"
          format: "sarif"
          output: "trivy-frontend-fs.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          trivyignores: "frontend/.trivyignore"

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-frontend-fs.sarif"
          category: "trivy-frontend-fs"

      # --- Docker Setup (QEMU para emulação ARM64) ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build & Push Multi-arch (AMD64 + ARM64) ---
      - name: Build and Push Multi-arch Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_APP_VERSION=${{ needs.tag-creation.outputs.created_tag || format('dev-{0}', github.sha) }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.tag-creation.outputs.created_tag || format('dev-{0}', github.sha) }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=QuaLact Frontend
            org.opencontainers.image.description=Frontend Next.js for QuaLact platform
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.tag-creation.outputs.created_tag || format('dev-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # --- Trivy Image Scan (bloqueia CRITICAL/HIGH em main e PRs para main) ---
      - name: Trivy — Docker Image Scan
        if: always() && steps.push.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          format: "table"
          exit-code: ${{ env.TRIVY_BLOCKING_EXIT_CODE }}
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: "frontend/.trivyignore"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # --- Trivy Image SARIF ---
      - name: Trivy — Image SARIF Report
        if: always() && steps.push.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          format: "sarif"
          output: "trivy-frontend-image.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          trivyignores: "frontend/.trivyignore"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Image SARIF to GitHub Security
        if: always() && steps.push.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-frontend-image.sarif"
          category: "trivy-frontend-image"

  # --------------------------------------------------------------------
  # 3) RELEASE CREATION
  # --------------------------------------------------------------------
  release-creation:
    name: 3. Automatic Creation Process of New Releases
    runs-on: ubuntu-latest
    needs: [tag-creation, frontend-docker]
    if: needs.frontend-docker.result == 'success' && needs.tag-creation.outputs.created_tag != ''
    permissions:
      contents: write
      packages: write # marca a imagem do outro componente com a versão

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mesma versão nas duas imagens e seção deste componente nas notas
      # (.github/scripts/release-notes.sh).
      - name: Prepare release notes
        run: bash .github/scripts/release-notes.sh frontend "${{ needs.tag-creation.outputs.created_tag }}"

      # Backend e frontend publicam na MESMA release: quem chegar primeiro cria,
      # o outro acrescenta a sua seção (append_body).
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag-creation.outputs.created_tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          name: Release ${{ needs.tag-creation.outputs.created_tag }}
          generate_release_notes: true
          append_body: true
          body_path: release-notes.md
