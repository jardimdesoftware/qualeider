# Valida as mensagens de todos os commits de um PR (Conventional Commits).
# Regras em backend/commitlint.config.mjs. Commits de bots (Dependabot, Actions) e de
# merge ficam de fora.

name: Commitlint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    name: Mensagens de commit no padrão
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Instalar commitlint
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Validar commits do PR
        run: |
          backend/node_modules/.bin/commitlint --config backend/commitlint.config.mjs \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
