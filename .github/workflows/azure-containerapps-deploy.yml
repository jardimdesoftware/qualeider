name: Azure Container Apps Deploy

on:
  workflow_run:
    workflows:
      - Backend CI/CD
      - Frontend CI/CD
    types:
      - completed

  workflow_dispatch:

concurrency:
  group: qualeider-azure-deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: jardimdesoftware
  IMAGE_TAG: latest
  AZURE_RESOURCE_GROUP: rg-qualeider-206522191
  BACKEND_CONTAINER_APP: backend
  FRONTEND_CONTAINER_APP: frontend
  PUBLIC_HEALTH_URL: https://qualeider.valerialima.me/api/health

jobs:
  deploy:
    name: Deploy latest images to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SBOM directory
        run: mkdir -p sbom

      - name: Generate backend SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/qualeider-backend:${{ env.IMAGE_TAG }}"
          format: "cyclonedx"
          output: "sbom/qualeider-backend.cdx.json"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate frontend SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/qualeider-frontend:${{ env.IMAGE_TAG }}"
          format: "cyclonedx"
          output: "sbom/qualeider-frontend.cdx.json"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sbom-cyclonedx
          path: sbom/*.cdx.json
          retention-days: 90

      - name: Commit SBOM files to repository
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sbom/*.cdx.json

          if git diff --cached --quiet; then
            echo "SBOM files are already up to date."
            exit 0
          fi

          git commit -m "chore(sbom): update Trivy SBOM files" \
            -m "Generated from deployment source ${DEPLOY_SHA}."
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container Apps
        uses: azure/cli@v3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        with:
          inlineScript: |
            set -euo pipefail

            az extension add --name containerapp --upgrade

            BACKEND_IMAGE="${REGISTRY}/${GHCR_OWNER}/qualeider-backend:${IMAGE_TAG}"
            FRONTEND_IMAGE="${REGISTRY}/${GHCR_OWNER}/qualeider-frontend:${IMAGE_TAG}"

            echo "Deploying backend image: ${BACKEND_IMAGE}"
            az containerapp update \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${BACKEND_CONTAINER_APP}" \
              --image "${BACKEND_IMAGE}" \
              --set-env-vars \
                DEPLOY_SHA="${DEPLOY_SHA}" \
                DEPLOY_RUN_ID="${DEPLOY_RUN_ID}"

            echo "Deploying frontend image: ${FRONTEND_IMAGE}"
            az containerapp update \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --name "${FRONTEND_CONTAINER_APP}" \
              --image "${FRONTEND_IMAGE}" \
              --set-env-vars \
                NEXT_PUBLIC_API_URL="/api" \
                DEPLOY_SHA="${DEPLOY_SHA}" \
                DEPLOY_RUN_ID="${DEPLOY_RUN_ID}"

      - name: Verify public healthcheck
        uses: azure/cli@v3
        with:
          inlineScript: |
            set -euo pipefail

            for attempt in $(seq 1 30); do
              echo "Healthcheck attempt ${attempt}/30: ${PUBLIC_HEALTH_URL}"
              if curl -fsS "${PUBLIC_HEALTH_URL}"; then
                echo ""
                echo "Deploy verified."
                exit 0
              fi
              sleep 10
            done

            echo "Healthcheck failed after waiting for the new revision."
            exit 1
