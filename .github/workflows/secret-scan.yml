name: Secret scan

# Procura segredos (chaves, tokens, senhas) em todo o histórico do repositório,
# que é público. Configuração em .gitleaks.toml; falsos positivos já auditados
# em .gitleaksignore. Para rodar localmente, veja SECURITY.md.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "40 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    name: Gitleaks (histórico completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Imagem oficial fixada por versão + digest (sem a gitleaks-action, que exige
      # licença para repositórios de organização).
      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            --entrypoint sh \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c 'git config --global --add safe.directory /repo &&
                gitleaks detect --source=/repo --redact --verbose --no-banner --log-opts="--all"'
