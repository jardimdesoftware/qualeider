name: k6 capacity production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Digite true para confirmar o teste de capacidade em produção
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  capacity-test:
    if: ${{ inputs.confirm_production }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Executar patamares públicos de capacidade
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e SUMMARY_PATH=evidencias/k6-qualeider-capacity-summary.json grafana/k6:1.8.2 run k6/capacity.js
      - name: Guardar evidência do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-qualeider-capacity-${{ github.run_id }}
          path: evidencias/k6-qualeider-capacity-summary.json
          if-no-files-found: warn
          retention-days: 90
