# Virtual host padrão para uma VM que hospeda mais de uma aplicação.
# Instale como /etc/nginx/sites-available/00-default-deny e habilite-o antes
# dos sites do EduTrace e do Qualeider. Assim, um Host sem configuração não
# recebe acidentalmente a primeira aplicação carregada pelo Nginx.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
