# =============================================================================
# EXEMPLO para o nginx DO SERVIDOR (o que termina o TLS na frente do stack Docker)
# =============================================================================
# Este arquivo é só documentação: o docker-compose não o usa e ele NÃO é aplicado
# automaticamente. O nginx do servidor (ex.: "nginx/1.24.0 (Ubuntu)") vive fora
# deste repositório; copie o que precisar para o site dele, ajuste e recarregue:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois de aplicar, confira com:
#
#   node frontend/scripts/verify-security-headers.mjs https://qualeider.valerialima.me
#
# 1) Em /etc/nginx/nginx.conf, dentro do bloco http { }, para não revelar a
#    versão do nginx (header Server e páginas de erro):
#
#        server_tokens off;
#
# 2) No site (ex.: /etc/nginx/sites-available/qualeider):

server {
    listen 80;
    server_name qualeider.valerialima.me;
    return 301 https://$host$request_uri;
}

server {
    # "ssl http2" na mesma linha funciona no nginx 1.24 (a diretiva separada
    # "http2 on;" só existe a partir da 1.25.1).
    listen 443 ssl http2;
    server_name qualeider.valerialima.me;

    # Caminhos criados pelo certbot (ajuste se forem outros).
    ssl_certificate     /etc/letsencrypt/live/qualeider.valerialima.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qualeider.valerialima.me/privkey.pem;

    # HSTS em TODAS as respostas, inclusive as geradas por este nginx (erros).
    # A aplicação também envia o header; o proxy_hide_header evita a duplicata.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        # Porta em que o nginx do docker-compose está publicado no servidor
        # (NGINX_HTTP_PORT no .env; padrão 80 — ajuste para a que você usa).
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Repassa o IP real do cliente (sobrescrevendo o que o cliente enviar).
        # É daqui que o nginx do compose e o rate limit do backend tiram o IP;
        # sem isso todos os usuários parecem vir do mesmo endereço.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
