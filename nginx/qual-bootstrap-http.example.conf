# Virtual host HTTP temporário usado apenas para emitir o primeiro certificado.
server {
    listen 80;
    server_name alexandrejota.me www.alexandrejota.me qualact.alexandrejota.me;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://alexandrejota.me$request_uri;
    }
}
