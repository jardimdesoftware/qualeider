# Harness de teste do nginx/nginx.conf: o nginx real, com a configuração do
# repositório, na frente de um upstream "eco" (sem throttling), respondendo como
# "frontend" e "backend". Usado por verify-nginx.mjs.
name: qualeider-nginx-test

services:
  echo:
    image: node:24-alpine
    command: ["node", "/echo.js"]
    volumes:
      - ./echo.js:/echo.js:ro
    networks:
      default:
        aliases:
          - frontend
          - backend

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - echo
