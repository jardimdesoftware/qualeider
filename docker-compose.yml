# =============================================================================
# docker-compose.yml — Qualeider | Produção (build local)
# =============================================================================
# Stack de produção enxuta: apenas os serviços essenciais da aplicação.
# Frontend, backend e banco de dados — sem proxy, sem infra extra.
#
# Esse arquivo é usado quando você quer rodar a aplicação completa
# com build das imagens localmente (ex: CI não configurado ainda).
#
# Para produção via imagens GHCR pré-publicadas, use:
#   docker compose -f docker-compose.prod.yml up -d
#
# Para ambiente local com nginx (simulação de produção):
#   docker compose -f docker-compose.local.yml up -d
#
# Para desenvolvimento com hot-reload:
#   docker compose -f docker-compose.dev.yml up -d
#
# Uso:
#   docker compose up --build -d
#   Acesse o frontend em: http://localhost:3001
#   Acesse a API em:      http://localhost:3000/api
#   API Docs:             http://localhost:3000/api-docs
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — banco de dados principal
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:14-alpine
    container_name: qualeider-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      POSTGRES_DB: ${POSTGRES_DB:-qualeider}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - qualeider-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — cache distribuído (ativo em NODE_ENV=production)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: qualeider-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
    networks:
      - qualeider-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend — API NestJS
  # Porta 3000 exposta para acesso direto (ou via proxy externo como Traefik)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qualeider-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qualeider}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      PORT: 3000
      NODE_ENV: production
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-noreply@qualeider.com}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
    networks:
      - qualeider-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Frontend — Next.js
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: qualeider-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    networks:
      - qualeider-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local

networks:
  qualeider-network:
    driver: bridge
